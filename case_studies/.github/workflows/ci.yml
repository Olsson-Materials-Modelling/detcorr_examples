name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quick-verification:
    name: Quick verification (${{ matrix.compatibility }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compatibility: minimum supported
            python-version: "3.10"
            constraints: constraints-minimum.txt
          - compatibility: latest available
            python-version: "3.13"
            constraints: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'detcorr @ git+https://github.com/Olsson-Materials-Modelling/detcorr.git@a414f063515359f70952e2717a506b75e69e4b0b'
          if [ -n "${{ matrix.constraints }}" ]; then
            python -m pip install -c "${{ matrix.constraints }}" -e '.[test]'
          else
            python -m pip install -e '.[test]'
          fi
          python -m pip check
          python scripts/environment_report.py
      - name: Static quality gates
        run: |
          ruff check .
          ruff format --check .
      - name: Verify committed scientific payload
        run: >-
          python verify_repository.py --output-root reference_results
      - name: Run registered quick analyses
        run: python run_studies.py --quick --output-root outputs
      - name: Test
        run: python -m pytest
      - name: Verify public result surface
        run: >-
          python verify_repository.py --output-root outputs
          --allow-quick-nonclaim
