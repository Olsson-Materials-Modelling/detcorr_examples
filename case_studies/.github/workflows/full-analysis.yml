name: Full registered analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned analysis environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'detcorr @ git+https://github.com/Olsson-Materials-Modelling/detcorr.git@a414f063515359f70952e2717a506b75e69e4b0b'
          python -m pip install -c constraints-publisher.txt -e '.[test]'
          python -m pip check
      - name: Record environment
        run: python scripts/environment_report.py --output environment-report.json
      - name: Static quality gates
        run: |
          ruff check .
          ruff format --check .
      - name: Run full registered reanalysis
        run: python run_studies.py --full --output-root outputs-full
      - name: Test and verify
        run: |
          python -m pytest
          python verify_repository.py --output-root reference_results
          python verify_repository.py --output-root outputs-full --compare-reference reference_results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registered-analysis-${{ github.sha }}
          path: |
            environment-report.json
            outputs-full/
          if-no-files-found: error
          retention-days: 90
