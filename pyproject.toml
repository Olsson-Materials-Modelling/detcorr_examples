[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["examples"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "detcorr_integration: tests that exercise the installed detcorr API"
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["B008"]
